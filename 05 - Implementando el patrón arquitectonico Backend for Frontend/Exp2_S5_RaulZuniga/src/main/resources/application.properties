spring.application.name=Duoc

# Conexion a MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/backendIII?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate›
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Ejecuta schema.sql para crear las tablas donde se escriben los CSV.
spring.sql.init.mode=always

# Tokens simples por canal BFF para demostracion.
app.security.tokens.web=${BFF_WEB_TOKEN:web-token-xyz}
app.security.tokens.mobile=${BFF_MOBILE_TOKEN:mobile-token-xyz}
app.security.tokens.atm=${BFF_ATM_TOKEN:atm-token-xyz}

# HTTPS opcional para ejecucion local o despliegue.
# Crear el keystore con:
# keytool -genkeypair -alias banco-xyz -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore src/main/resources/banco-xyz.p12 -validity 3650
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:banco-xyz.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:banco-xyz}
