server:
  port: 8081
bank:
  config-origin: "Configuracion cargada desde Spring Cloud Config Server"
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: core-banking-withdrawal-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: cl.duoc.bancoxyz.events
    listener:
      concurrency: 3
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banco_xyz}
    username: ${SPRING_DATASOURCE_USERNAME:banco_user}
    password: ${SPRING_DATASOURCE_PASSWORD:banco_password_local}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always
