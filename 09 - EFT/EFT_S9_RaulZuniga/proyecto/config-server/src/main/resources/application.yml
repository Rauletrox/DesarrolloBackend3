spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:/app/config-repo,file:./config-repo,file:./proyecto/config-repo
server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include: health,info
