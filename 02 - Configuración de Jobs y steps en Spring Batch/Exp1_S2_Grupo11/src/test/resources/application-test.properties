# Se usa H2 aislada para verificar persistencia sin modificar la base MySQL de desarrollo.
spring.datasource.url=jdbc:h2:mem:duoc_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
# Se usa un esquema sin columnas calculadas para validar la migracion idempotente en H2.
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
# Se evita ejecutar Jobs al crear el contexto para que cada prueba controle sus parametros.
batch.ejecutar-al-inicio=false
# Se reducen los logs de prueba para destacar solo los eventos relevantes.
logging.level.com.backen3.Duoc=WARN
