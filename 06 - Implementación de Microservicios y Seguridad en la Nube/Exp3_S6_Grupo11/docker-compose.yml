services:
  postgres:
    image: postgres:16
    container_name: banco-xyz-postgres
    environment:
      POSTGRES_DB: banco_xyz
      POSTGRES_USER: banco_user
      POSTGRES_PASSWORD: banco_password_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_user -d banco_xyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/app/config-repo:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  batch-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: core-banking-service
    entrypoint: ["/usr/local/bin/batch-init.sh"]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banco_xyz
      SPRING_DATASOURCE_USERNAME: banco_user
      SPRING_DATASOURCE_PASSWORD: banco_password_local
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  core-banking-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: core-banking-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: core-banking-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banco_xyz
      SPRING_DATASOURCE_USERNAME: banco_user
      SPRING_DATASOURCE_PASSWORD: banco_password_local
      SPRING_BATCH_JOB_ENABLED: "false"
    ports:
      - "8081:8081"
    depends_on:
      batch-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bff-web-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: bff-web-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: bff-web-service
    ports:
      - "8082:8082"
    depends_on:
      core-banking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bff-mobile-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: bff-mobile-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: bff-mobile-service
    ports:
      - "8083:8083"
    depends_on:
      core-banking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bff-atm-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: bff-atm-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: bff-atm-service
    ports:
      - "8084:8084"
    depends_on:
      core-banking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
